name: Deploy to Cloudflare Pages

# The site is a static export: `out/` is gitignored, so a push alone publishes
# nothing — something has to run the build. Doing it here rather than relying on
# the Pages dashboard means a failed deployment is visible in the Actions tab
# with a log, instead of silently not happening.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OS validation dependencies
        run: python -m pip install --disable-pip-version-check --quiet python-docx

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate VANSMITHLAB OS
        run: |
          npm run os:index
          npm run os:structure -- work/corpus
          npm run os:sources -- work/corpus

      - name: Build static export
        run: npm run build

      - name: Verify the export exists
        run: |
          test -f out/index.html || { echo "out/index.html missing — the export did not run"; exit 1; }
          echo "pages: $(find out -name '*.html' | wc -l)"

      # wrangler-action buries the real error inside a collapsed group, so the
      # CLI is called directly: the log then shows which projects exist and what
      # actually failed. `pages deploy` cannot create a project non-interactively,
      # so it is created first if missing.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: vansmithlab
        run: |
          set -o pipefail
          echo "::group::Existing Pages projects"
          ./node_modules/.bin/wrangler pages project list || echo "could not list projects — check the token has Cloudflare Pages: Edit"
          echo "::endgroup::"

          if ! ./node_modules/.bin/wrangler pages project list 2>/dev/null | grep -qw "$PROJECT"; then
            echo "Project '$PROJECT' not found — creating it."
            ./node_modules/.bin/wrangler pages project create "$PROJECT" --production-branch=main
          fi

          ./node_modules/.bin/wrangler pages deploy out --project-name="$PROJECT" --branch=main
