<svg width="1672" height="941" viewBox="0 0 1672 941" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Механизм перехода сакрального кода в моду</title>
<desc>Оригинальная редакционная диаграмма VANSMITHLAB: три колонки — Форма, Функция, Модная адаптация — с нейтральными абстрактными силуэтами и подписями, без изображения конкретных религиозных символов.</desc>
<rect width="1672" height="941" fill="#f4f1ea"/>

<text x="100" y="88" font-family="'DM Mono',ui-monospace,monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#c4482d">РЕЛИГИЯ И МОДА · МЕХАНИЗМ ПЕРЕХОДА</text>
<line x1="100" y1="108" x2="1572" y2="108" stroke="#131313" stroke-opacity="0.22" stroke-width="1"/>

<!-- three column headers -->
<text x="335" y="175" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="26" font-weight="600" fill="#131313">Форма</text>
<text x="836" y="175" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="26" font-weight="600" fill="#131313">Функция</text>
<text x="1337" y="175" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="26" font-weight="600" fill="#131313">Модная адаптация</text>

<!-- neutral abstract silhouettes column 1: draped / layered / structured shapes, no religious iconography -->
<g stroke="#131313" stroke-opacity="0.55" stroke-width="2" fill="none">
<path d="M275 230 Q335 215 395 230 L410 340 Q335 360 260 340 Z"/>
<path d="M275 380 L395 380 L385 480 Q335 495 285 480 Z"/>
<path d="M290 520 Q335 505 380 520 L390 610 L280 610 Z"/>
</g>
<text x="335" y="650" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#6f6b63">драпировка, слой,</text>
<text x="335" y="670" text-anchor="middle" font-family="Manrope,Arial,sans-serif" font-size="14" fill="#6f6b63">закрытость, конструкция</text>

<!-- arrow 1 -->
<line x1="470" y1="420" x2="700" y2="420" stroke="#c4482d" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- column 2: function labels -->
<g font-family="Manrope,Arial,sans-serif" font-size="16" fill="#131313">
<rect x="740" y="240" width="192" height="52" rx="8" fill="none" stroke="#131313" stroke-opacity="0.3"/>
<text x="836" y="272" text-anchor="middle">Ритуал</text>
<rect x="740" y="310" width="192" height="52" rx="8" fill="none" stroke="#131313" stroke-opacity="0.3"/>
<text x="836" y="342" text-anchor="middle">Статус</text>
<rect x="740" y="380" width="192" height="52" rx="8" fill="none" stroke="#131313" stroke-opacity="0.3"/>
<text x="836" y="412" text-anchor="middle">Идентичность</text>
<rect x="740" y="450" width="192" height="52" rx="8" fill="none" stroke="#131313" stroke-opacity="0.3"/>
<text x="836" y="482" text-anchor="middle">Защита</text>
</g>

<!-- arrow 2 -->
<line x1="970" y1="420" x2="1200" y2="420" stroke="#c4482d" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- column 3: fashion adaptation labels -->
<g font-family="Manrope,Arial,sans-serif" font-size="16" fill="#131313">
<rect x="1240" y="205" width="200" height="52" rx="8" fill="none" stroke="#c4482d" stroke-opacity="0.5"/>
<text x="1340" y="237" text-anchor="middle">Культурная память</text>
<rect x="1240" y="270" width="200" height="52" rx="8" fill="none" stroke="#c4482d" stroke-opacity="0.5"/>
<text x="1340" y="302" text-anchor="middle">Цитирование</text>
<rect x="1240" y="335" width="200" height="52" rx="8" fill="none" stroke="#c4482d" stroke-opacity="0.5"/>
<text x="1340" y="367" text-anchor="middle">Конструктивное влияние</text>
<rect x="1240" y="400" width="200" height="52" rx="8" fill="none" stroke="#c4482d" stroke-opacity="0.5"/>
<text x="1340" y="432" text-anchor="middle">Материал</text>
<rect x="1240" y="465" width="200" height="52" rx="8" fill="none" stroke="#c4482d" stroke-opacity="0.5"/>
<text x="1340" y="497" text-anchor="middle">Провокация</text>
<rect x="1240" y="530" width="200" height="52" rx="8" fill="none" stroke="#c4482d" stroke-opacity="0.5"/>
<text x="1340" y="562" text-anchor="middle">Коммерческая стилизация</text>
</g>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#c4482d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="100" y1="855" x2="1572" y2="855" stroke="#131313" stroke-opacity="0.22" stroke-width="1"/>
<text x="100" y="890" font-family="Manrope,Arial,sans-serif" font-size="13" fill="#6f6b63">Силуэты условны и не воспроизводят конкретные религиозные облачения или символы.</text>
<text x="1572" y="890" text-anchor="end" font-family="'DM Mono',ui-monospace,monospace" font-size="13" letter-spacing="1" fill="#6f6b63">VANSMITHLAB · ОРИГИНАЛЬНАЯ ДИАГРАММА</text>
</svg>
