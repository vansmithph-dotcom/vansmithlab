<text x="78" y="96" fill="#c84a31" text-anchor="start" font-family="monospace" font-size="15" font-weight="500" letter-spacing="2">VANSMITHLAB / ANALYSIS / GAME-UI-006</text>
<text x="78" y="170" fill="#171716" text-anchor="start" font-family="Georgia" font-size="52" font-weight="500" letter-spacing="0">THE GAME SCREEN: LAYERED READING</text>
<line x1="78" y1="202" x2="1522" y2="202" stroke="#171716" stroke-width="2"/>

<!-- dark viewport -->
<rect x="120" y="290" width="1360" height="440" fill="#171716"/>
