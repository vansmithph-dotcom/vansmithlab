<rect width="1672" height="941" fill="#f4f1ea"/>

<text x="100" y="88" font-family="'DM Mono',ui-monospace,monospace" font-size="18" font-weight="500" letter-spacing="2" fill="#c4482d">PRADA · ХРОНОЛОГИЯ 1913–2025</text>
