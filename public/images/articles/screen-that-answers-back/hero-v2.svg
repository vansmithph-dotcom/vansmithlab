<text x="670" y="580" fill="#777167" text-anchor="middle" font-family="monospace" font-size="16" letter-spacing="2">STATE</text>
</g>

<!-- connecting arrows -->
<path d="M800 640 Q890 750 1030 700" fill="none" stroke="#c84a31" stroke-width="4" stroke-linecap="round"/>
<path d="M1030 600 Q1120 500 1040 410" fill="none" stroke="#c84a31" stroke-width="4" stroke-linecap="round"/>
<path d="M910 360 Q950 300 900 250" fill="none" stroke="#c84a31" stroke-width="4" stroke-linecap="round"/>
