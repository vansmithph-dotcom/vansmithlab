<circle cx="794" cy="294" r="5" fill="#fbf8f1"/>
<text x="800" y="212" fill="#777167" text-anchor="middle" font-family="monospace" font-size="16" letter-spacing="2">GAZE</text>
</g>

<!-- right: cursor -->
<g>
<rect x="930" y="420" width="130" height="92" rx="8" fill="#171716"/>
<rect x="940" y="430" width="110" height="72" rx="4" fill="#fbf8f1"/>
