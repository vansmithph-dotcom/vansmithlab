</g>

<!-- bottom: touch -->
<g>
<circle cx="800" cy="700" r="58" fill="#ead3ca" stroke="#171716" stroke-width="3"/>
<rect x="776" y="600" width="24" height="70" rx="12" fill="#fbf8f1" stroke="#171716" stroke-width="3"/>
