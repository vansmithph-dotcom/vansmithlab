<text x="78" y="96" fill="#c84a31" text-anchor="start" font-family="monospace" font-size="15" font-weight="500" letter-spacing="2">VANSMITHLAB / ANALYSIS / INTERFACE-005</text>
<text x="78" y="170" fill="#171716" text-anchor="start" font-family="Georgia" font-size="52" font-weight="500" letter-spacing="0">THE SCREEN THAT ANSWERS BACK</text>
<line x1="78" y1="202" x2="1522" y2="202" stroke="#171716" stroke-width="2"/>

<!-- behavioural loop: circular arrows -->
<circle cx="800" cy="520" r="255" fill="none" stroke="#ded7ca" stroke-width="3"/>
<circle cx="800" cy="520" r="255" fill="none" stroke="#284e78" stroke-width="3" stroke-dasharray="12 16" opacity=".6"/>

<!-- top: gaze / eye -->
<g>
<path d="M690 300 Q800 240 910 300 Q800 360 690 300 Z" fill="#fbf8f1" stroke="#171716" stroke-width="3"/>
<circle cx="800" cy="300" r="34" fill="#c84a31"/>
