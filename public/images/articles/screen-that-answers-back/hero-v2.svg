<path d="M670 630 Q700 670 740 700" fill="none" stroke="#c84a31" stroke-width="4" stroke-linecap="round"/>

<text x="78" y="824" fill="#777167" text-anchor="start" font-family="Arial" font-size="19" font-weight="400" letter-spacing="0">Gaze, cursor, touch, state and system response as one behavioural loop</text>
