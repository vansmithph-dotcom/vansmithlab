<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img">
<rect width="1600" height="900" fill="#f2eee6"/>
<defs>
<pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#ded7ca" stroke-width="1"/></pattern>
</defs>
<rect x="40" y="40" width="1520" height="820" fill="url(#grid)" opacity=".46"/>
